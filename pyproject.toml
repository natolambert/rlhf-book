# Root pyproject.toml - for diagram generation and book build scripts
# Note: code/ has its own pyproject.toml for ML dependencies
[project]
name = "rlhf-book"
version = "0.1.0"
description = "RLHF Book - diagrams and build scripts"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Diagram generation (diagrams/)
    "matplotlib>=3.10.8",
    "transformers>=4.57.5",
    # Library data generation (book/scripts/generate_library.py)
    "datasets>=2.19.0",
]

[project.optional-dependencies]
skills = [
    "google-genai>=1.63.0",
]
teach = [
    # TODO: pin back to a PyPI release (colloquium==0.2.3) once it ships with the
    # Google-Fonts <link> fix (natolambert/colloquium#41), the step-fragment
    # paragraph-spacing fix (#43), and the box/conversation smart-typography fix
    # (#44), the PDF-export image time-budget fix (#45), and the iframe print
    # fallback (#51). Until then, track the reviewed commit directly.
    "colloquium @ git+https://github.com/natolambert/colloquium.git@1003f7eb6de86bd79e4e3fa65ec602cc70ba3dc8",
]
