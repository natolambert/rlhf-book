# Root pyproject.toml - for diagram generation and book build scripts
# Note: code/ has its own pyproject.toml for ML dependencies
[project]
name = "rlhf-book"
version = "0.1.0"
description = "RLHF Book - diagrams and build scripts"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Diagram generation (diagrams/)
    "matplotlib>=3.10.8",
    "transformers>=4.57.5",
    # Library data generation (book/scripts/generate_library.py)
    "datasets>=2.19.0",
]

[project.optional-dependencies]
skills = [
    "google-genai>=1.63.0",
]
teach = [
    # Pinned to a commit: uv.lock is gitignored, so tracking colloquium main
    # let an upstream change break unrelated deploys. This is 0.3.0 plus the
    # footnote-citation fix (natolambert/colloquium#70); bump deliberately.
    "colloquium @ git+https://github.com/natolambert/colloquium.git@27aab4df7b760684d61570386e77541f0a1a0c74",
]
